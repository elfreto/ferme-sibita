# L'application est publiée par Cloudflare Pages (https://ferme-sibita.pages.dev) :
# github.io est bloqué sur certains réseaux camerounais. GitHub Pages ne garde qu'une page
# qui renvoie vers la nouvelle adresse ; ce workflow lance aussi les tests.
name: Tests et redirection GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirection
      - id: deploiement
        uses: actions/deploy-pages@v4
